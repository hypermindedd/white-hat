[project]
name = "White Hat web"
goal = "Verify the web C1/C2 candidate for PR #2."

[[commands]]
id = "s2-panel-source"
title = "Adopted White Hat panel source provenance"
argv = ["python3", "scripts/verify_s2_panel.py"]

[[goals]]
id = "PANEL_SOURCE"
title = "Pinned implemented White Hat panel"
hard_gate = true
criteria = [{kind="check",check="command.s2-panel-source"}]

[[commands]]
id = "kotlin-architecture"
title = "Unified Kotlin/BFF architecture contract"
argv = ["python3", "scripts/verify_architecture.py"]

[[goals]]
id = "ARCHITECTURE"
title = "Single Kotlin business authority and module boundaries"
hard_gate = true
criteria = [{kind="check",check="command.kotlin-architecture"}]

[[commands]]
id = "evaluation-tools"
title = "C3 evaluation receipt integrity"
argv = ["python3", "-B", "-m", "unittest", "discover", "-s", "evaluation", "-p", "test_*.py"]

[[goals]]
id = "C3_EVALUATION"
title = "Evaluation runner and blind comparison integrity"
hard_gate = true
criteria = [{kind="check",check="command.evaluation-tools"}]

[[commands]]
id = "web-bff"
title = "BFF syntax and OIDC regression"
argv = ["bash", "-ec", "npm run check && npm test"]
cwd = "apps/web-bff"

[[commands]]
id = "kotlin-postgres"
title = "Kotlin API with PostgreSQL and OpenAPI"
argv = ["bash", "-ec", "python3 scripts/verify_docs.py && node scripts/generate_legacy_parity.mjs && node scripts/generate_server_policy.mjs && node scripts/generate_api_contract.mjs && ./gradlew --no-daemon :shared:contracts:jvmTest :shared:contracts:compileKotlinJs :server:application:test :server:api:test :server:adapters:test :server:api:installDist && python3 scripts/verify_api_samples.py"]

[[goals]]
id = "WEB"
title = "Web BFF checks"
hard_gate = true
criteria = [{kind="check",check="command.web-bff"}]

[[goals]]
id = "DB"
title = "Kotlin and PostgreSQL checks"
hard_gate = true
criteria = [{kind="check",check="command.kotlin-postgres"}]
