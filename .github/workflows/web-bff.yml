name: Web BFF / browser adapter validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-bff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whitehat_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: whitehat_sessions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whitehat_test -d whitehat_sessions_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WH_SESSION_TEST_DB: postgresql://whitehat_test:synthetic-ci-only@127.0.0.1:5432/whitehat_sessions_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/web-bff
      - name: Check the BFF and browser adapter
        run: npm run check
        working-directory: apps/web-bff
      - name: Run OIDC/BFF fixture integration
        run: npm test
        working-directory: apps/web-bff
