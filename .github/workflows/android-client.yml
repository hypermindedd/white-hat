name: White Hat Android validation
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'shared/client/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android-client.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-build:
    # Install the SDK explicitly instead of depending on runner image contents.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon -PwhiteHatAndroid=true :apps:android:assembleDebug :apps:android:assembleDebugAndroidTest
      - run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apps/android/build/outputs/apk/debug/android-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: white-hat-android-development
          path: apps/android/build/outputs/apk/**/*.apk
          if-no-files-found: error
